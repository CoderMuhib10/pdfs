<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hardware-Locked Reader</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #222; font-family: sans-serif; }
        #lock-screen { position: fixed; inset: 0; background: #fff; z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .box { text-align: center; padding: 30px; width: 320px; box-shadow: 0 5px 30px rgba(0,0,0,0.1); border-radius: 12px; }
        input { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #1a73e8; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        #viewer { display: none; height: 100vh; flex-direction: column; }
        .toolbar { height: 45px; background: #fff; border-bottom: 1px solid #ddd; display: flex; align-items: center; padding: 0 15px; justify-content: space-between; font-size: 14px; }
        .viewport { flex: 1; overflow: auto; background: #555; display: flex; flex-direction: column; align-items: center; padding: 20px 0; }
        canvas { width: 95vw !important; height: auto !important; margin-bottom: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); background: #fff; }
    </style>
</head>
<body>

<div id="lock-screen">
    <div class="box">
        <h2 style="margin:0">Device Locked</h2>
        <p style="font-size: 12px; color: #777;">This content is locked to your specific hardware.</p>
        <input type="password" id="p-input" placeholder="Access Code">
        <button onclick="verify()">Unlock</button>
        <p id="msg" style="color:red; font-size:12px; margin-top:10px;"></p>
    </div>
</div>

<div id="viewer" oncontextmenu="return false;">
    <div class="toolbar">
        <span id="p-label">Loading...</span>
        <button onclick="localStorage.removeItem('active_sess'); location.reload();">Logout</button>
    </div>
    <div class="viewport" id="scroll">
        <div id="content"></div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
<script>
    const PASSWORDS = ["PASS_USER_01", "PASS_USER_02"];
    const pdfUrl = 'YOUR_RAW_GITHUB_LINK_HERE';

    // 1. GENERATE HARDWARE FINGERPRINT (Unique to physical machine)
    function getHardwareFingerprint() {
        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl');
        const debugInfo = gl ? gl.getExtension('WEBGL_debug_renderer_info') : null;
        const renderer = debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : "unknown";
        
        // Combine CPU, GPU, and Screen Specs
        const id = `${navigator.hardwareConcurrency}-${renderer}-${screen.colorDepth}`;
        return btoa(id);
    }

    // 2. SESSION CHECK
    window.onload = function() {
        if (localStorage.getItem('active_sess') === 'true') show();
    };

    function verify() {
        const input = document.getElementById('p-input').value;
        const msg = document.getElementById('msg');
        
        if (!PASSWORDS.includes(input)) {
            msg.innerText = "Invalid Password.";
            return;
        }

        const currentHW = getHardwareFingerprint();
        const lockKey = `hw_lock_${input}`;
        const storedHW = localStorage.getItem(lockKey);

        if (!storedHW) {
            // First time this password is used: Permanently lock to this hardware
            localStorage.setItem(lockKey, currentHW);
            success();
        } else if (storedHW === currentHW) {
            // Hardware matches stored record
            success();
        } else {
            // Password is correct, but hardware fingerprint is different
            msg.innerText = "Error: This code is registered to another physical device.";
        }
    }

    function success() {
        localStorage.setItem('active_sess', 'true');
        show();
    }

    function show() {
        document.getElementById('lock-screen').style.display = 'none';
        document.getElementById('viewer').style.display = 'flex';
        render();
    }

    // 3. RENDER PDF (Fit to screen width)
    async function render() {
        const pdfjsLib = window['pdfjs-dist/build/pdf'];
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/api/pdf.js/3.4.120/pdf.worker.min.js';
        
        try {
            const pdf = await pdfjsLib.getDocument(pdfUrl).promise;
            document.getElementById('p-label').innerText = `Pages: ${pdf.numPages}`;
            const target = document.getElementById('content');
            
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const viewport = page.getViewport({ scale: 1.5 }); // Good quality
                const canvas = document.createElement('canvas');
                canvas.height = viewport.height;
                canvas.width = viewport.width;
                target.appendChild(canvas);
                await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
            }
        } catch (e) { alert("PDF failed to load. Check your link."); }
    }
</script>
</body>
</html>
