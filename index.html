<!DOCTYPE html>
<html lang="en">
<head>
    <!-- 1. Google Analytics (Tag Manager) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-74DCVR30B5');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Secure PDF Reader</title>
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #333; font-family: sans-serif; overflow: hidden; }
        #lock-screen { position: fixed; inset: 0; background: white; z-index: 9999; display: flex; align-items: center; justify-content: center; text-align: center; }
        .box { padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 320px; }
        input { width: 100%; padding: 14px; margin: 15px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button.primary { width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        #viewer-container { display: none; height: 100vh; flex-direction: column; width: 100%; }
        .toolbar { height: 50px; background: #fff; border-bottom: 1px solid #ddd; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; z-index: 100; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .viewport { flex: 1; overflow-y: auto; overflow-x: hidden; background: #525659; display: flex; flex-direction: column; align-items: center; padding: 20px 0; -webkit-overflow-scrolling: touch; }
        canvas { display: block; width: 95vw !important; height: auto !important; margin-bottom: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.4); background: white; }
        #err { color: #ef4444; font-size: 13px; margin-top: 10px; }
    </style>
</head>
<body>

<div id="lock-screen">
    <div class="box">
        <h2 style="margin:0">Secure Access</h2>
        <p style="font-size: 13px; color: #666;">Enter your code to unlock the document.</p>
        <input type="password" id="pass-input" placeholder="Access Code">
        <button class="primary" onclick="handleLogin()">Unlock Document</button>
        <p id="err"></p>
    </div>
</div>

<div id="viewer-container" oncontextmenu="return false;">
    <div class="toolbar">
        <span id="p-info" style="font-weight:bold; color:#444;">Loading Pages...</span>
        <button onclick="handleLogout()" style="padding: 6px 12px; background: #f3f4f6; border: 1px solid #ddd; border-radius: 5px; cursor: pointer;">Logout</button>
    </div>
    <div class="viewport">
        <div id="content-target"></div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
<script>
    const PASSWORDS = ["PASS_USER_01", "PASS_USER_02"];
    const pdfUrl = 'https://raw.githubusercontent.com/CoderMuhib10/pdfs/main/wordpress_30_day_plan.pdf'; // MUST BE RAW LINK

    // Ensure worker is set correctly
    const pdfjsLib = window['pdfjs-dist/build/pdf'];
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

    // 1. HARDWARE IDENTIFICATION
    function getDeviceID() {
        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl');
        const debugInfo = gl ? gl.getExtension('WEBGL_debug_renderer_info') : null;
        const renderer = debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : "unknown";
        return btoa(`${navigator.hardwareConcurrency}-${renderer}-${screen.colorDepth}`);
    }

    // 2. SESSION LOGIC
    window.onload = function() {
        if (localStorage.getItem('secure_session_active') === 'true') {
            showViewer();
        }
    };

    function handleLogin() {
        const pass = document.getElementById('pass-input').value;
        const err = document.getElementById('err');
        
        if (!PASSWORDS.includes(pass)) {
            err.innerText = "Invalid access code."; return;
        }

        const deviceID = getDeviceID();
        const lockKey = `hw_lock_${pass}`;
        const lockedTo = localStorage.getItem(lockKey);

        if (!lockedTo) {
            localStorage.setItem(lockKey, deviceID);
            proceed(pass);
        } else if (lockedTo === deviceID) {
            proceed(pass);
        } else {
            err.innerText = "Error: This code is registered to another physical device.";
        }
    }

    function proceed(pass) {
        localStorage.setItem('secure_session_active', 'true');
        // Track Login in Google Analytics
        if (typeof gtag === 'function') {
            gtag('event', 'login_success', { 'user_id': pass });
        }
        showViewer();
    }

    function showViewer() {
        document.getElementById('lock-screen').style.display = 'none';
        document.getElementById('viewer-container').style.display = 'flex';
        renderPDF();
    }

    function handleLogout() {
        localStorage.removeItem('secure_session_active');
        location.reload();
    }

    // 3. ROBUST PDF RENDERING
    async function renderPDF() {
        try {
            const loadingTask = pdfjsLib.getDocument(pdfUrl);
            const pdf = await loadingTask.promise;
            
            document.getElementById('p-info').innerText = `Total Pages: ${pdf.numPages}`;
            const target = document.getElementById('content-target');
            target.innerHTML = ''; // Clear previous

            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const viewport = page.getViewport({ scale: 1.5 });
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                canvas.height = viewport.height;
                canvas.width = viewport.width;
                target.appendChild(canvas);
                
                await page.render({ canvasContext: ctx, viewport: viewport }).promise;
            }
        } catch (error) {
            console.error(error);
            document.getElementById('p-info').innerText = "PDF Load Error!";
            alert("PDF failed to load. Check if your GitHub link is RAW and file is public.");
        }
    }
</script>
</body>
</html>
