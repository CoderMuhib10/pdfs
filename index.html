<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Secure PDF Reader</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #333; font-family: sans-serif; }
        
        /* Login UI */
        #lock-screen { position: fixed; inset: 0; background: white; z-index: 999; display: flex; align-items: center; justify-content: center; text-align: center; }
        .box { padding: 30px; border-radius: 15px; box-shadow: 0 0 20px rgba(0,0,0,0.1); width: 300px; }
        input { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }

        /* Viewer Layout */
        #viewer { display: none; height: 100vh; flex-direction: column; width: 100%; }
        .toolbar { height: 50px; background: #fff; border-bottom: 1px solid #ddd; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; z-index: 100; font-size: 14px; }
        .viewport { flex: 1; overflow: auto; background: #525659; display: flex; flex-direction: column; align-items: center; padding-top: 10px; -webkit-overflow-scrolling: touch; }
        
        /* Important: This prevents cropping */
        canvas { 
            max-width: 100% !important; 
            height: auto !important; 
            margin-bottom: 15px; 
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            background: #fff;
        }
    </style>
</head>
<body>

<div id="lock-screen">
    <div class="box">
        <h3>Secure Document</h3>
        <p style="font-size: 12px; color: #666;">Locked to this specific browser instance.</p>
        <input type="password" id="pass" placeholder="Password">
        <button onclick="check()">Unlock</button>
        <p id="err" style="color:red; font-size:12px;"></p>
    </div>
</div>

<div id="viewer" oncontextmenu="return false;">
    <div class="toolbar">
        <span id="p-count">Loading...</span>
        <div>
            <button onclick="location.reload()" style="width: auto; padding: 5px 10px; background: #666;">Logout</button>
        </div>
    </div>
    <div class="viewport" id="scroll-box">
        <div id="content"></div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
<script>
    const PASSWORDS = ["PASS_USER_01", "PASS_USER_02"];
    const pdfUrl = 'https://raw.githubusercontent.com/CoderMuhib10/pdfs/main/wordpress_30_day_plan.pdf';

    // 1. IMPROVED STICKY LOCKING (UUID Method)
    // This creates a permanent ID inside the browser storage that doesn't care about "Desktop Mode"
    function getBrowserToken() {
        let token = localStorage.getItem('app_browser_token');
        if (!token) {
            token = Math.random().toString(36).substring(2) + Date.now().toString(36);
            localStorage.setItem('app_browser_token', token);
        }
        return token;
    }

    function check() {
        const p = document.getElementById('pass').value;
        if (!PASSWORDS.includes(p)) { 
            document.getElementById('err').innerText = "Wrong password."; 
            return; 
        }

        const currentToken = getBrowserToken();
        const savedToken = localStorage.getItem('lock_' + p);

        if (!savedToken) {
            // First time using this password? Bind it to this browser's unique token
            localStorage.setItem('lock_' + p, currentToken);
            open();
        } else if (savedToken === currentToken) {
            // Same browser, same password
            open();
        } else {
            // Correct password, but different browser/device
            document.getElementById('err').innerText = "This code is locked to another device/browser.";
        }
    }

    function open() {
        document.getElementById('lock-screen').style.display = 'none';
        document.getElementById('viewer').style.display = 'flex';
        load();
    }

    // 2. RESPONSIVE PDF RENDERING (Fixed Cropping)
    async function load() {
        const pdfjsLib = window['pdfjs-dist/build/pdf'];
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
        
        const pdf = await pdfjsLib.getDocument(pdfUrl).promise;
        document.getElementById('p-count').innerText = `Total Pages: ${pdf.numPages}`;
        
        const container = document.getElementById('content');
        const screenWidth = window.innerWidth;

        for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            
            // Calculate scale to fit the page exactly to the screen width
            const unscaledViewport = page.getViewport({ scale: 1 });
            const fitScale = (screenWidth - 20) / unscaledViewport.width;
            
            const viewport = page.getViewport({ scale: fitScale });
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            canvas.height = viewport.height;
            canvas.width = viewport.width;
            container.appendChild(canvas);
            
            await page.render({ canvasContext: ctx, viewport }).promise;
        }
    }
</script>
</body>
</html>
